<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>The Cross App</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0B;--surface:#111113;--card:#18181C;--border:#27272F;
  --accent:#1a1a1a;--accent2:#333;--gold:#C9A84C;--green:#00E676;
  --blue:#2979FF;--text:#F5F5F7;--muted:#8E8E98;--danger:#FF3B30;
}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,#C9A84C11 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#ffffff08 0%,transparent 50%)}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(#27272F44 1px,transparent 1px),linear-gradient(90deg,#27272F44 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%)}
.login-card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px 36px;width:100%;max-width:400px;margin:20px;box-shadow:0 40px 80px rgba(0,0,0,0.5)}
.login-logo{text-align:center;margin-bottom:32px}
.logo-barbell{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.barbell-icon{display:flex;align-items:center;gap:2px}
.barbell-plate{width:7px;border-radius:2px;background:var(--gold)}
.barbell-bar{width:4px;height:32px;background:var(--gold);border-radius:1px}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:4px;color:var(--text);line-height:1}
.logo-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:6px;color:var(--muted);margin-top:4px}
.form-group{margin-bottom:16px}
label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 14px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;transition:border-color .15s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:var(--card)}
textarea{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:8px;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;transition:all .15s;letter-spacing:.5px;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--gold);color:#000;text-transform:uppercase}
.btn-primary:active{opacity:.85;transform:scale(.98)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:active{background:var(--border)}
.btn-danger{background:#FF3B3022;color:var(--danger);border:1px solid #FF3B3044}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-full{width:100%}
.forgot{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.forgot span{color:var(--gold);cursor:pointer}

/* PROFILE SWITCHER */
.profile-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.profile-btn{padding:12px;border-radius:10px;border:1px solid var(--border);background:transparent;cursor:pointer;text-align:center;transition:all .2s;-webkit-tap-highlight-color:transparent}
.profile-btn.active{border-color:var(--gold);background:#C9A84C15}
.profile-btn .pb-icon{font-size:24px;display:block;margin-bottom:4px}
.profile-btn .pb-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.profile-btn.active .pb-label{color:var(--gold)}

/* APP LAYOUT */
#app{display:none;flex-direction:column;min-height:100vh}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:50}
.topbar-logo{display:flex;align-items:center;gap:8px}
.topbar-logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--text)}
.topbar-logo-text span{color:var(--gold)}
.topbar-right{display:flex;align-items:center;gap:8px}
.notif-btn{position:relative;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
.notif-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.logout-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:'Barlow',sans-serif;padding:6px 10px;border-radius:6px;border:1px solid var(--border)}

/* PAGE */
.page-content{flex:1;padding:20px 16px;max-width:600px;width:100%;margin:0 auto}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:20px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;background:none;border:none;cursor:pointer;color:var(--muted);transition:color .15s;-webkit-tap-highlight-color:transparent}
.nav-btn.active{color:var(--gold)}
.nav-btn .nav-icon{font-size:20px}
.nav-btn .nav-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.pb-bottom{height:70px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.gold::before{background:var(--gold)}
.stat-card.green::before{background:var(--green)}
.stat-card.blue::before{background:var(--blue)}
.stat-card.red::before{background:var(--danger)}
.stat-value{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;letter-spacing:1px}
.stat-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stat-change{font-size:11px;color:var(--green);margin-top:4px;font-weight:600}

/* CHECKIN SLOTS */
.slots-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.slot:active:not(.full){transform:scale(.97)}
.slot.checked{border-color:var(--green);background:#00E67611}
.slot.full{opacity:.5;cursor:not-allowed}
.slot.full::after{content:'LOTADO';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--danger);border:2px solid var(--danger);padding:2px 8px;letter-spacing:3px;opacity:.8}
.slot-time{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;line-height:1}
.slot-coach{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
.cap-bar{height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden}
.cap-fill{height:100%;border-radius:2px;transition:width .4s}
.cap-fill.ok{background:var(--green)}
.cap-fill.warn{background:var(--gold)}
.cap-fill.bad{background:var(--danger)}
.slot-checked-label{font-size:11px;color:var(--green);font-weight:600;margin-top:6px}

/* WOD */
.wod-hero{background:linear-gradient(135deg,#C9A84C15 0%,transparent 60%);border:1px solid #C9A84C33;border-radius:14px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.wod-hero::before{content:'WOD';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:'Bebas Neue',sans-serif;font-size:80px;color:#C9A84C0D;letter-spacing:4px;pointer-events:none}
.wod-date{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.wod-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;line-height:1}
.wod-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.wod-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #27272F66}
.wod-section:last-child{border-bottom:none;margin-bottom:0}
.wod-section-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.wod-text{font-size:13px;line-height:1.7;white-space:pre-line}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase}
.badge-green{background:#00E67622;color:var(--green)}
.badge-red{background:#FF3B3022;color:var(--danger)}
.badge-gold{background:#C9A84C22;color:var(--gold)}
.badge-blue{background:#2979FF22;color:var(--blue)}
.badge-muted{background:var(--border);color:var(--muted)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid #27272F55}
tbody td{padding:10px 10px;font-size:13px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;color:white;flex-shrink:0}

/* RANKING */
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #27272F44}
.rank-num{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);width:22px;text-align:center}
.rank-num.top{color:var(--gold)}

/* NOTIF */
.notif-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #27272F44;cursor:pointer}
.notif-dot-item{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:5px;flex-shrink:0}
.notif-dot-item.read{background:var(--border)}

/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:100px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.bar-item{width:100%;background:var(--gold);border-radius:3px 3px 0 0;opacity:.8}
.bar-day{font-size:9px;color:var(--muted)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;padding:0}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:0 0 env(safe-area-inset-bottom)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px 16px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px}
.modal-body{padding:0 20px}
.modal-footer{padding:16px 20px;display:flex;gap:10px}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--green);border-radius:10px;padding:12px 20px;z-index:999;font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:toastIn .3s ease}
@keyframes toastIn{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:16px 0}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:8px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:all .15s;border:1px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.tab.active{background:#C9A84C15;color:var(--gold);border-color:#C9A84C33}

/* ADMIN NAV TABS */
.admin-nav{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.admin-nav::-webkit-scrollbar{display:none}
.admin-tab{padding:14px 16px;background:none;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent}
.admin-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

@media(min-width:600px){
  .slots-grid{grid-template-columns:repeat(3,1fr)}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .bottom-nav{display:none}
  .pb-bottom{display:none}
  #app{flex-direction:row}
  .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0}
  .main-area{margin-left:220px;flex:1;display:flex;flex-direction:column}
  .topbar{position:sticky}
  .page-content{max-width:900px;padding:24px 28px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-bg"></div>
  <div class="login-grid"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-barbell">
        <div class="barbell-icon">
          <div class="barbell-plate" style="height:28px"></div>
          <div class="barbell-plate" style="height:22px"></div>
          <div class="barbell-plate" style="height:16px"></div>
        </div>
        <div class="logo-text">The Cross</div>
      </div>
      <div class="logo-sub">Box Management App</div>
    </div>

    <div class="profile-btns">
      <button class="profile-btn active" id="btn-admin-role" onclick="setRole('admin')">
        <span class="pb-icon">👑</span>
        <span class="pb-label">Admin</span>
      </button>
      <button class="profile-btn" id="btn-student-role" onclick="setRole('student')">
        <span class="pb-icon">🏋️</span>
        <span class="pb-label">Aluno</span>
      </button>
    </div>

    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="login-email" value="admin@thecross.com"/>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-pwd" value="123456"/>
    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()" style="margin-top:4px">Entrar</button>
    <div class="forgot">Esqueci minha senha? <span>Recuperar</span></div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR (desktop) -->
  <div class="sidebar" id="sidebar" style="display:none">
    <div style="padding:20px 16px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="display:flex;align-items:center;gap:2px">
          <div style="width:5px;height:20px;background:var(--gold);border-radius:1px"></div>
          <div style="width:5px;height:15px;background:var(--gold);border-radius:1px"></div>
          <div style="width:5px;height:10px;background:var(--gold);border-radius:1px"></div>
        </div>
        <span style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px">THE CROSS</span>
      </div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:2px">BOX MANAGEMENT</div>
    </div>
    <nav style="flex:1;padding:12px 0" id="sidebar-nav"></nav>
    <div style="padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px" id="sidebar-profile"></div>
  </div>

  <!-- MAIN -->
  <div class="main-area" id="main-area" style="flex:1;display:flex;flex-direction:column">
    <div class="topbar">
      <div class="topbar-logo">
        <div style="display:flex;align-items:center;gap:3px;margin-right:6px">
          <div style="width:4px;height:16px;background:var(--gold);border-radius:1px"></div>
          <div style="width:4px;height:12px;background:var(--gold);border-radius:1px"></div>
          <div style="width:4px;height:8px;background:var(--gold);border-radius:1px"></div>
        </div>
        <span class="topbar-logo-text">THE <span>CROSS</span></span>
      </div>
      <div class="topbar-right">
        <button class="notif-btn" onclick="showPage('notif')">🔔<div class="notif-dot"></div></button>
        <button class="logout-btn" onclick="doLogout()">Sair</button>
      </div>
    </div>

    <div class="page-content" id="page-content"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav" id="bottom-nav"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const COACHES = ["Rodrigo Silva","Ana Beatriz","Carlos Mendes","Fernanda Lima"];
const WD_TIMES = ["06:00","07:00","08:00","09:00","12:00","13:00","17:00","18:00","19:00","20:00"];
const WE_TIMES = ["08:00","09:00","10:00"];
const dow = new Date().getDay();
const TIMES = (dow===0||dow===6) ? WE_TIMES : WD_TIMES;

let STATE = {
  role: 'admin',
  user: null,
  page: 'dashboard',
  slots: TIMES.map((t,i)=>({id:i+1,time:t,coach:COACHES[i%4],capacity:18,checkins:Math.floor(Math.random()*16)})),
  students: [
    {id:1,name:"Lucas Ferreira",email:"lucas@email.com",plan:"Premium",status:"Ativo",checkins:22,av:"LF"},
    {id:2,name:"Mariana Costa",email:"mariana@email.com",plan:"Básico",status:"Ativo",checkins:18,av:"MC"},
    {id:3,name:"Rafael Gomes",email:"rafael@email.com",plan:"Premium",status:"Inadimplente",checkins:7,av:"RG"},
    {id:4,name:"Juliana Rocha",email:"juliana@email.com",plan:"Premium",status:"Ativo",checkins:25,av:"JR"},
    {id:5,name:"Diego Alves",email:"diego@email.com",plan:"Básico",status:"Ativo",checkins:15,av:"DA"},
    {id:6,name:"Camila Torres",email:"camila@email.com",plan:"Premium",status:"Inativo",checkins:3,av:"CT"},
    {id:7,name:"Thiago Martins",email:"thiago@email.com",plan:"Básico",status:"Ativo",checkins:20,av:"TM"},
    {id:8,name:"Amanda Souza",email:"amanda@email.com",plan:"Premium",status:"Ativo",checkins:30,av:"AS"},
  ],
  checkedIn: null,
  wod: {
    title:"HERO WOD",
    warmup:"3 rounds:\n800m corrida leve\n10 air squats\n10 invert row\n10 arm circles",
    technique:"Snatch Balance\n5 x 3 @ 60-70%\nFoco: posição overhead, controle excêntrico",
    strength:"Back Squat\n5 x 5 @ 80%\nDescanso: 2-3 min entre séries",
    metcon:'"CINDY" — AMRAP 20min\n5 Pull-ups\n10 Push-ups\n15 Air Squats\n\n⭐ Goal: 20+ rounds',
    cooldown:"5 min foam roll pernas\nEstiramentos de quadril x 2 min/lado",
    notes:"Hidratação é fundamental hoje! Tragam toalha.",
  },
  notifications:[
    {id:1,text:"WOD de hoje foi publicado!",time:"7:00",read:false},
    {id:2,text:"Seu check-in das 18:00 foi confirmado.",time:"Ontem",read:false},
    {id:3,text:"Aula de Sábado cancelada.",time:"2 dias",read:true},
    {id:4,text:"Box fechado feriado 12/06.",time:"3 dias",read:true},
  ],

// ── HELPERS ───────────────────────────────────────────────────────────────────
function av(initials, size=32, color='#C9A84C'){
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${color};font-size:${size*.4}px">${initials}</div>`;
}
function badge(text,cls){return `<span class="badge badge-${cls}">${text}</span>`}
function statusBadge(s){
  if(s==="Ativo") return badge("Ativo","green");
  if(s==="Inadimplente") return badge("Inadimplente","red");
  return badge("Inativo","muted");
}
function capFillClass(p){ return p>=90?"bad":p>=70?"warn":"ok"; }
function slotHTML(slot){
  const full = slot.checkins >= slot.capacity;
  const checked = STATE.checkedIn === slot.id;
  const pct = Math.min((slot.checkins/slot.capacity)*100,100);
  return `
    <div class="slot${full&&!checked?' full':''}${checked?' checked':''}" onclick="doCheckin(${slot.id})">
      <div class="slot-time">${slot.time}</div>
      <div class="slot-coach">${slot.coach}</div>
      <div class="slot-cap">
        <span>${slot.checkins}/${slot.capacity}</span>
        <span>${slot.capacity-slot.checkins} vagas</span>
      </div>
      <div class="cap-bar"><div class="cap-fill ${capFillClass(pct)}" style="width:${pct}%"></div></div>
      ${checked?'<div class="slot-checked-label">✓ Inscrito — toque para cancelar</div>':''}
    </div>`;
}
function showToast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<span style="color:var(--green)">✓</span> ${msg}`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
function openModal(title,body,footer){
  document.getElementById('modal-title').innerHTML=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-footer').innerHTML=footer||'';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
function todayStr(){
  return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}

function buildNav(){
  const nav = STATE.user.role==='admin' ? ADMIN_NAV : STUDENT_NAV;

function updateNavActive(){

      s.style.color=STATE.page===n.id?'var(--gold)':'var(--muted)';

function showPage(id){
  STATE.page=id;

  const c=document.getElementById('page-content');
  switch(id){
    case 'dashboard': c.innerHTML=renderDashboard(); break;
    case 'students': c.innerHTML=renderStudents(); break;
    case 'coaches': c.innerHTML=renderCoaches(); break;
    case 'schedule': c.innerHTML=renderSchedule(); break;
    case 'wod-admin': c.innerHTML=renderWodAdmin(); break;
    case 'checkin': c.innerHTML=renderCheckin(); break;

    case 'notif': c.innerHTML=renderNotif(); break;
    case 'profile': c.innerHTML=renderProfile(); break;
  }
  c.scrollTop=0;
  window.scrollTo(0,0);
}

function renderStudents(){

    <input placeholder="🔍 Buscar aluno..." oninput="filterStudents(this.value)" style="margin-bottom:14px" id="student-search"/>

function studentsTable(list){
  if(!list.length) return '<div style="text-align:center;padding:30px;color:var(--muted)">Nenhum aluno encontrado</div>';
  return list.map(s=>`
    <div class="card" style="padding:14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px">
        ${av(s.av,38,s.status==='Inadimplente'?'#FF3B30':s.status==='Inativo'?'#555':'#C9A84C')}
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${s.name}</div>
          <div style="font-size:12px;color:var(--muted)">${s.email}</div>
          <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">
            ${badge(s.plan,s.plan==='Premium'?'gold':'blue')}
            ${statusBadge(s.status)}
            <span style="font-size:11px;color:var(--muted)">${s.checkins} check-ins</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${s.status!=='Inadimplente'
            ?`<button class="btn btn-danger btn-sm" onclick="blockStudent(${s.id})">🔒</button>`
            :`<button class="btn btn-ghost btn-sm" onclick="unblockStudent(${s.id})">🔓</button>`}
        </div>
      </div>
    </div>`).join('');
}
function filterStudents(q){
  const f=STATE.students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('students-list').innerHTML=studentsTable(f);
}
function filterStudentTab(status,el){
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const f=status==='todos'?STATE.students:STATE.students.filter(s=>s.status.toLowerCase()===status);
  document.getElementById('students-list').innerHTML=studentsTable(f);
}
function blockStudent(id){
  STATE.students=STATE.students.map(s=>s.id===id?{...s,status:'Inadimplente'}:s);
  showPage('students'); showToast('Aluno bloqueado');
}
function unblockStudent(id){
  STATE.students=STATE.students.map(s=>s.id===id?{...s,status:'Ativo'}:s);

    <div class="pb-bottom"></div>`;

function doCheckin(id){
  const slot=STATE.slots.find(s=>s.id===id);
  if(!slot) return;
  const full=slot.checkins>=slot.capacity;
  if(full && STATE.checkedIn!==id) return;
  if(STATE.checkedIn===id){
    STATE.slots=STATE.slots.map(s=>s.id===id?{...s,checkins:s.checkins-1}:s);
    STATE.checkedIn=null;
    showToast('Check-in cancelado');
  } else {
    if(STATE.checkedIn){
      STATE.slots=STATE.slots.map(s=>s.id===STATE.checkedIn?{...s,checkins:s.checkins-1}:s);
    }
    STATE.slots=STATE.slots.map(s=>s.id===id?{...s,checkins:s.checkins+1}:s);
    STATE.checkedIn=id;
    showToast(`✅ Check-in confirmado para as ${slot.time}!`);
  }
  const grid=document.getElementById('slots-grid');
  if(grid) grid.innerHTML=STATE.slots.map(s=>slotHTML(s)).join('');
  const checked=STATE.slots.find(s=>s.id===STATE.checkedIn);
  const header=document.querySelector('.section-header span');
}
